name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Windows 上不涉及执行位，Linux runner 上如果 checkout 丢了 +x 就会 126
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build all versions
        run: ./gradlew buildAll --no-daemon --stacktrace

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/precise-glower-mc*.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/precise-glower-mc*.jar
          generate_release_notes: true
